<section id="timeline" class="timeline-section page-section">
  <!-- Introduces the open timeline view -->
  <section class="timeline-hero">
    <div class="timeline-hero-inner">
      <h1>Explore Timeline</h1>

      <p>
      Use the timeline to explore the history of computing at St Andrews through key events.
      Open any item to learn more about its context and sources.  
      </p>
      <button class="timeline-start js-timeline-start" type="button">
        Start exploring
        <span>↓</span>
      </button>
    </div>
  </section>

  <!-- The timeline controls and records are created here by timeline.js. -->
  <div class="timeline-shell" id="timeline-explorer">
    <div class="timeline-controls">
      <div class="timeline-mode-group js-timeline-modes"></div>

      <div class="timeline-search-row">
        <input class="js-timeline-search" type="search" placeholder="Search titles..." />
        <input class="js-timeline-year" type="text" placeholder="Jump to year" />
        <button class="js-timeline-year-button" type="button">Go</button>
      </div>

      <div class="timeline-filter-group js-timeline-filters"></div>
    </div>

    <div class="timeline-view js-timeline-view"></div>
  </div>
</section>
