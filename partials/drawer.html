<!-- Shared drawer used to open a full archive record shared from any section. -->
<aside class="build-drawer" aria-hidden="true">
  <div class="build-drawer-panel">
    <button class="build-drawer-close js-build-drawer-close" type="button">
      Close
    </button>

    <p class="drawer-kicker">Archive record</p>
    <h2 class="js-build-drawer-title">Record title</h2>
    <p class="drawer-date js-build-drawer-date">Date</p>
    <!-- The selected record is added here by drawer.js. -->
    <div class="js-build-drawer-content"></div>
  </div>
</aside>
